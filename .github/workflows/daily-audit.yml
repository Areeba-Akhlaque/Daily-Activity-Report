name: Daily Activity Audit

on:
  schedule:
    # Run at 12:00 UTC = 4:00 AM PT (capture FULL previous day)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      skip_email:
        description: 'Skip sending email to managers (use for testing)'
        type: boolean
        default: false
      full_rebuild:
        description: 'Rebuild all historical data from START_DATE (use after changing name_mappings or exclusion rules)'
        type: boolean
        default: false

# Permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

# Serialize Pages deploys across runs. Without this, two runs (e.g. the cron
# tick + a manual workflow_dispatch, or two cron ticks that overlap) can both
# try to deploy and the second fails with HTTP 400 "in progress deployment".
# cancel-in-progress=false means: queue the new run, don't kill the active one
# mid-flight (which could leave the live site in a broken state).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  daily-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

# Re-enable Node.js logic as requested
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: |
          cd execution
          npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Setup Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN }}' > token.json
      
      - name: Create .env file
        run: |
          cat > .env << EOF
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          CLICKUP_API_KEY=${{ secrets.CLICKUP_API_KEY }}
          CLICKUP_WORKSPACE_ID=${{ secrets.CLICKUP_WORKSPACE_ID }}
          CLICKUP_TEAM_ID=${{ secrets.CLICKUP_TEAM_ID }}
          GITHUB_TOKEN=${{ secrets.GH_PAT }}
          GITHUB_ORG=Pvragon
          FIGMA_TOKEN=${{ secrets.FIGMA_TOKEN }}
          FIGMA_TEAM_ID=${{ secrets.FIGMA_TEAM_ID }}
          BACKENDLESS_APP_ID=${{ secrets.BACKENDLESS_APP_ID }}
          BACKENDLESS_API_KEY=${{ secrets.BACKENDLESS_API_KEY }}
          BACKENDLESS_DEV_LOGIN=${{ secrets.BACKENDLESS_DEV_LOGIN }}
          BACKENDLESS_DEV_PASSWORD=${{ secrets.BACKENDLESS_DEV_PASSWORD }}
          BACKENDLESS_API_URL=https://console.okridecare.com
          MERCURY_API_TOKEN=${{ secrets.MERCURY_API_TOKEN }}
          EMAIL_RECIPIENTS=areeba@pvragon.com,jaime@pvragon.com,bradd@pvragon.com
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          DASHBOARD_URL=https://Areeba-Akhlaque.github.io/Daily-Activity-Report/dashboard/index.html
          START_DATE=2026-01-01
          SKIP_EMAIL=${{ github.event.inputs.skip_email || 'false' }}
          FULL_REBUILD=${{ github.event.inputs.full_rebuild || 'false' }}
          ROLLING_DAYS=7
          EOF
      
      - name: Run daily workflow
        run: python orchestration/run_daily_workflow.py
      
      - name: Commit and Push Dashboard Data
        # Run even if a platform fetch failed. run_daily_workflow.py exits 1 when ANY of
        # its 10 steps fails, so without if:always() a single flaky step (e.g. a transient
        # SMTP error on the email) silently skips the commit AND the Pages deploy — which
        # is what previously made the dashboard look frozen for days. The rolling merge
        # preserves history, so publishing partial data is strictly better than not updating.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add dashboard/data.json dashboard/hourly_data.json dashboard/charts/
          # Event caches must persist across runs for rolling-window mode
          # (generate_activity_time.py reads these for session analysis — historical
          # timestamps older than ROLLING_DAYS would be lost without persistence).
          git add dashboard/figma_events_cache.json dashboard/clickup_events_cache.json \
                  dashboard/gworkspace_events_cache.json dashboard/backendless_events_cache.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Auto-update dashboard metrics - $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Clean untracked/modified files before rebase to avoid conflicts.
            # Use stash + pop so nothing is permanently lost on the runner.
            git stash --include-untracked
            git pull --rebase -X ours origin main
            git stash pop || true
            git push origin main
          fi

      - name: Upload Chart to Google Drive
        continue-on-error: true
        run: python orchestration/upload_charts_to_drive.py

      - name: Prepare Dashboard for Deployment
        if: always()
        run: |
          mkdir -p _site/dashboard
          # Copy to root for primary access
          cp -r dashboard/* _site/
          # Also keep in /dashboard for backward compatibility
          cp -r dashboard/* _site/dashboard/
          cp .nojekyll _site/

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'

      - name: Workflow summary
        if: always()
        run: |
          echo "## Daily Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Google Sheet](https://docs.google.com/spreadsheets/d/${{ secrets.GOOGLE_SHEET_ID }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Dashboard](https://Areeba-Akhlaque.github.io/Daily-Activity-Report/dashboard/index.html)" >> $GITHUB_STEP_SUMMARY

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: daily-audit
    if: always()
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
